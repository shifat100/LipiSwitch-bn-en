<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --md-sys-color-primary: #1a73e8;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #e8f0fe;
      --md-sys-color-on-primary-container: #174ea6;
      --md-sys-color-surface: #ffffff;
      --md-sys-color-surface-variant: #f1f3f4;
      --md-sys-color-outline: #dadce0;
      --md-sys-color-on-surface: #202124;
      --md-sys-color-on-surface-variant: #5f6368;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-full: 9999px;
      --md-elevation-1: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 290px;
      background-color: #f8f9fa;
      color: var(--md-sys-color-on-surface);
      padding: 16px;
      user-select: none;
    }

    /* Top Bar */
    .app-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .app-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 2px 4px rgba(26, 115, 232, 0.3);
    }

    .app-title-group h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-sys-color-on-surface);
      line-height: 1.2;
    }

    .app-title-group p {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Active Website Chip */
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-full);
      padding: 5px 12px;
      margin-bottom: 16px;
    }

    .chip-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #34a853;
    }

    .chip-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Material Card Group */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .md-card {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--md-sys-color-surface);
      border: 1.5px solid var(--md-sys-color-outline);
      border-radius: var(--md-shape-corner-medium);
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .md-card:hover {
      border-color: #bdc1c6;
      background-color: #fdfdfd;
    }

    .md-card input[type="radio"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--md-sys-color-on-surface-variant);
      border-radius: 50%;
      margin-right: 12px;
      display: grid;
      place-content: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .md-card input[type="radio"]::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: scale(0);
      background-color: var(--md-sys-color-primary);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .md-card input[type="radio"]:checked {
      border-color: var(--md-sys-color-primary);
    }

    .md-card input[type="radio"]:checked::before {
      transform: scale(1);
    }

    .md-card.active {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-primary-container);
    }

    .card-content {
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }

    .md-card.active .card-title {
      color: var(--md-sys-color-on-primary-container);
      font-weight: 600;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .md-card.active .card-subtitle {
      color: var(--md-sys-color-on-primary-container);
      opacity: 0.8;
    }

    /* Material Action Button */
    .md-btn {
      width: 100%;
      height: 40px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .md-btn:hover {
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.35);
      background-color: #1967d2;
    }

    .md-btn:active {
      transform: scale(0.98);
    }

    .md-btn:disabled {
      background-color: #dadce0;
      color: #80868b;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Status Bar */
    #status-indicator {
      margin-top: 10px;
      min-height: 16px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- Material App Bar -->
  <div class="app-bar">
    <div class="app-icon">अ⇄অ</div>
    <div class="app-title-group">
      <h1>LipiSwitch</h1>
      <p>Material Script Switcher</p>
    </div>
  </div>

  <!-- Domain Chip -->
  <div class="chip">
    <span class="chip-indicator"></span>
    <span class="chip-text" id="targetDomain">Locating tab...</span>
  </div>

  <!-- Cards -->
  <div class="card-list">
    <label class="md-card" id="card-hi2bn">
      <input type="radio" name="scriptRule" value="hi2bn">
      <div class="card-content">
        <span class="card-title">हिन्दी ➔ বাংলা</span>
        <span class="card-subtitle">Render Hindi text in Bengali</span>
      </div>
    </label>

    <label class="md-card" id="card-bn2hi">
      <input type="radio" name="scriptRule" value="bn2hi">
      <div class="card-content">
        <span class="card-title">বাংলা ➔ हिन्दी</span>
        <span class="card-subtitle">Render Bengali text in Devanagari</span>
      </div>
    </label>

    <label class="md-card active" id="card-none">
      <input type="radio" name="scriptRule" value="none" checked>
      <div class="card-content">
        <span class="card-title">Original (Off)</span>
        <span class="card-subtitle">Retain site's original font</span>
      </div>
    </label>
  </div>

  <!-- Action Button -->
  <button id="applyBtn" class="md-btn">
    <span>Save & Apply</span>
  </button>

  <div id="status-indicator"></div>

  <script src="popup.js"></script>
</body>
</html>
